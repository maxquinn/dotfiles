# =============================================================================
# GENERAL
# =============================================================================
set -g default-terminal "tmux-256color"
set -as terminal-features "xterm-ghostty:256:RGB"
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

set -g mouse on                  # enable mouse support
set -g history-limit 10000       # scrollback buffer size
set -s escape-time 0             # no delay for escape key (important for nvim)
set -g focus-events on           # needed for some nvim plugins
set -g base-index 1              # start window numbering at 1 instead of 0
setw -g pane-base-index 1        # start pane numbering at 1 as well
set -g renumber-windows on       # re-number windows when one is closed

set -g extended-keys on
set -g extended-keys-format csi-u

# =============================================================================
# KEYBINDINGS
# =============================================================================

# Reload config
bind r source ~/.tmux.conf \; display "Config reloaded"

# Session switcher (fzf popup)
bind -n M-o display-popup -E -w 60% -h 60% "~/.config/tmux/sessions.sh"

# Set the session's base directory to the current pane's path
bind R attach-session -c "#{pane_current_path}" \; display "session root: #{pane_current_path}"

# Windows (always open at the session base directory)
bind -n M-t new-window -c "#{session_path}"
bind -n M-h previous-window
bind -n M-l next-window

# Panes
bind -n M-v split-window -h   # alt+v for vertical split
bind -n M-s split-window -v   # alt+s for horizontal split
bind -n M-x kill-pane
bind Enter respawn-pane -k
bind -n M-k swap-pane -U
bind -n M-j swap-pane -D
# Resizing
bind -n M-H resize-pane -L 2
bind -n M-J resize-pane -D 2
bind -n M-K resize-pane -U 2
bind -n M-L resize-pane -R 2

# Scrollback edit
bind e run-shell '~/.config/tmux/scrollback.sh "#{pane_id}"'

# =============================================================================
# APPEARANCE
# =============================================================================
set -g status-style "bg=default"
set -g status-position bottom
set -g status-justify centre

# Left: session name
set -g status-left "#[fg=#475266]#S  "
set -g status-left-length 30

# Right: prefix indicator
set -g status-right "#{?client_prefix,#[fg=#95E6CB],#[fg=#475266]} "
set -g status-right-length 10

# Pane borders
set -g pane-border-style "fg=#2a2d35"
set -g pane-active-border-style "fg=#95E6CB"
set -g pane-border-lines single
set -g pane-border-indicators arrows
set -g pane-border-status top
set -g pane-border-format " [ ###P #T ] "

# Windows
setw -g window-status-style "fg=#475266"
setw -g window-status-current-style "fg=#BFBDB6,bold"
setw -g window-status-format "#W"
setw -g window-status-current-format "#W"
setw -g window-status-separator "#[fg=#475266] • "

# =============================================================================
# PLUGINS
# =============================================================================
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
